apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kaushal-mental-models-pvc
  labels:
    app: kaushal-mental-models
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaushal-mental-models
  labels:
    app: kaushal-mental-models
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kaushal-mental-models
  template:
    metadata:
      labels:
        app: kaushal-mental-models
    spec:
      containers:
        - name: web
          image: kaushal-mental-models:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: kaushal-mental-models-config
          volumeMounts:
            - name: sqlite-storage
              mountPath: /app/prisma
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: "250m"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: sqlite-storage
          persistentVolumeClaim:
            claimName: kaushal-mental-models-pvc
