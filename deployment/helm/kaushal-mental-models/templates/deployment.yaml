{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kaushal-mental-models.fullname" . }}-pvc
  labels:
    {{- include "kaushal-mental-models.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kaushal-mental-models.fullname" . }}
  labels:
    {{- include "kaushal-mental-models.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kaushal-mental-models.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kaushal-mental-models.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "kaushal-mental-models.fullname" . }}-config
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: sqlite-storage
              mountPath: /app/data
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: sqlite-storage
          persistentVolumeClaim:
            claimName: {{ include "kaushal-mental-models.fullname" . }}-pvc
      {{- end }}
